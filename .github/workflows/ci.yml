name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Validate sample policy
        run: PYTHONPYCACHEPREFIX=.pycache python -m agent_policy_gate.cli validate --policy examples/policy.json
      - name: Compile sources
        run: PYTHONPYCACHEPREFIX=.pycache python -m compileall src tests
      - name: Syntax checks
        run: PYTHONPYCACHEPREFIX=.pycache python -m py_compile src/agent_policy_gate/*.py tests/*.py
      - name: Run unit tests
        run: PYTHONPYCACHEPREFIX=.pycache python -m unittest discover -s tests -t . -v
      - name: Smoke test JSON output
        run: PYTHONPYCACHEPREFIX=.pycache python -m agent_policy_gate.cli evaluate --policy examples/policy.json --trace examples/trace.json --format json > report.json
      - name: Smoke test SARIF output
        run: PYTHONPYCACHEPREFIX=.pycache python -m agent_policy_gate.cli evaluate --policy examples/policy.json --trace examples/trace.json --format sarif --output report.sarif
      - name: Smoke test CI enforcement
        run: |
          set +e
          PYTHONPYCACHEPREFIX=.pycache python -m agent_policy_gate.cli evaluate --policy examples/policy.json --trace examples/trace.json --fail-on deny
          status=$?
          test "$status" -eq 3
