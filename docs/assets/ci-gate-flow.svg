<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent Policy Gate CI Flow</title>
  <desc id="desc">Diagram showing policy validation, trace evaluation, SARIF output, and CI failure thresholds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9f4ea" />
      <stop offset="100%" stop-color="#efe5d3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c6b52" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e5b42"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)" rx="28"/>
  <text x="70" y="78" font-family="Georgia, serif" font-size="34" fill="#2c241b">Agent Policy Gate Delivery Flow</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Production-oriented path from agent runtime data to enforceable CI decisions and GitHub-native security output.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="200" height="150" rx="22" fill="#fffaf2" stroke="#ccb89b"/>
    <text x="100" y="212" font-family="Arial, sans-serif" font-size="22" fill="#2c241b">1. Inputs</text>
    <text x="100" y="248" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Policy JSON</text>
    <text x="100" y="278" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Agent trace JSON</text>
    <text x="100" y="308" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Pipeline thresholds</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="170" width="220" height="150" rx="22" fill="#fffaf2" stroke="#ccb89b"/>
    <text x="370" y="212" font-family="Arial, sans-serif" font-size="22" fill="#2c241b">2. Validate</text>
    <text x="370" y="248" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Schema sanity checks</text>
    <text x="370" y="278" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Duplicate rule detection</text>
    <text x="370" y="308" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Matcher coverage warnings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="170" width="220" height="150" rx="22" fill="#fffaf2" stroke="#ccb89b"/>
    <text x="660" y="212" font-family="Arial, sans-serif" font-size="22" fill="#2c241b">3. Evaluate</text>
    <text x="660" y="248" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Rule matching</text>
    <text x="660" y="278" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Risk scoring</text>
    <text x="660" y="308" font-family="Arial, sans-serif" font-size="18" fill="#5f5140">Allow / Review / Deny</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="140" width="210" height="100" rx="22" fill="#edf7f2" stroke="#7bb194"/>
    <text x="950" y="183" font-family="Arial, sans-serif" font-size="22" fill="#143a2e">SARIF Output</text>
    <text x="950" y="214" font-family="Arial, sans-serif" font-size="17" fill="#386654">GitHub code scanning</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="260" width="210" height="100" rx="22" fill="#fbf1da" stroke="#c8a85d"/>
    <text x="950" y="303" font-family="Arial, sans-serif" font-size="22" fill="#654100">Text / JSON / HTML</text>
    <text x="950" y="334" font-family="Arial, sans-serif" font-size="17" fill="#8b6720">Developer review artifacts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="380" width="210" height="100" rx="22" fill="#fdecea" stroke="#d07d74"/>
    <text x="950" y="423" font-family="Arial, sans-serif" font-size="22" fill="#6d1f18">Exit Code 3</text>
    <text x="950" y="454" font-family="Arial, sans-serif" font-size="17" fill="#94453e">Fail CI on review / deny / risk</text>
  </g>

  <path d="M270 245 H330" stroke="#6e5b42" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 245 H620" stroke="#6e5b42" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 220 H910" stroke="#6e5b42" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 275 H910" stroke="#6e5b42" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 330 C900 330 880 430 910 430" stroke="#6e5b42" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
</svg>
