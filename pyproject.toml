[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-policy-gate"
version = "0.1.0"
description = "Policy evaluation and audit reporting for AI agent tool execution."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Hamza Khan" }
]
keywords = ["ai-security", "agentic-ai", "policy-engine", "devsecops", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/hamzakhan/agent-policy-gate"
Issues = "https://github.com/hamzakhan/agent-policy-gate/issues"

[project.scripts]
apg = "agent_policy_gate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

